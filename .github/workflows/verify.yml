name: Offline release verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tier0:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: sudo apt-get update && sudo apt-get install -y clang
      - run: python -m venv /tmp/qwenputer-ci
      - run: /tmp/qwenputer-ci/bin/python -m pip install torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu
      - run: /tmp/qwenputer-ci/bin/python -m pip install -r requirements.txt
      - run: /tmp/qwenputer-ci/bin/python tools/check_release.py
      - run: /tmp/qwenputer-ci/bin/python tools/verify_all.py --tier 0
